name: Account-first downloads and expired-link help

on:
  push:
    branches: [chatgpt/download-account-first-20261114]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    defaults:
      run:
        working-directory: commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify JavaScript syntax
        run: node --check engine/static/site.js
      - name: Build and check generated storefront
        run: |
          python -m pip install 'jinja2>=3.1,<4' 'playwright>=1.48,<2'
          python engine/build_sites.py
          python engine/check_links.py
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify account renewal and expired-link lookup
        run: python tests/download_renewal_smoke.py
