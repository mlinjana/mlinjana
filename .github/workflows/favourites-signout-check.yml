name: Customer favourites logout safety
on:
  push:
    branches: [chatgpt/clear-favourites-on-signout-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    defaults:
      run:
        working-directory: commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check engine/static/site.js
      - run: |
          python -m pip install 'jinja2>=3.1,<4' 'playwright>=1.48,<2'
          python engine/build_sites.py
          python engine/check_links.py
          python -m playwright install --with-deps chromium
      - run: python tests/favourites_signout_smoke.py
