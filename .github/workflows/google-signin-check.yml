name: Google account sign-in regression checks

on:
  push:
    branches:
      - chatgpt/google-signin-diagnostics-20261114
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check engine/static/site.js
      - name: Install browser test dependencies
        run: |
          python -m pip install 'jinja2>=3.1,<4' 'playwright>=1.48,<2'
          python -m playwright install --with-deps chromium
      - name: Build and check site
        run: |
          python engine/build_sites.py
          python engine/check_links.py
      - name: Test Google account UX without third-party requests
        run: python tests/google_signin_smoke.py
